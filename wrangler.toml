name = "qingyun-shield"
type = "webpack"
account_id = "" # 请填写你的Cloudflare账户ID（在Cloudflare Dashboard右侧边栏底部的「Account ID」处可以找到）

# KV命名空间配置 - 必须正确配置此部分，否则加密链接无法被他人访问
[[kv_namespaces]]
id = "" # 请填写你在Cloudflare Dashboard创建的KV命名空间ID（创建步骤见下方说明）
binding = "PASSWORD_STORE" # 这个绑定名称必须与代码中使用的一致，不要修改

# 重要提示：
# 1. 必须在Cloudflare Dashboard中创建KV命名空间，并将ID填写到上面的配置中
#    创建步骤：
#    - 登录Cloudflare Dashboard (https://dash.cloudflare.com)
#    - 点击「Workers & Pages」
#    - 在左侧菜单选择「KV」
#    - 点击「Create namespace」
#    - 输入命名空间名称（如：qingyun-shield-kv）
#    - 创建后，复制显示的ID填入上方id字段
# 2. 确保绑定名称保持为"PASSWORD_STORE"，这与代码中的检查一致
# 3. 部署后，确认在Cloudflare Pages的设置中KV绑定已正确配置
#    - 在Pages项目设置中，找到「Functions」>「KV namespace bindings」
#    - 添加绑定：Variable name设为PASSWORD_STORE，选择你创建的KV命名空间
# 4. 如果未正确配置KV，分享的加密链接将无法被他人访问

# 环境变量配置
[vars]
ADMIN_PASSWORD = "" # 请设置一个强密码作为管理员密码
USE_REMOTE_STORAGE = "true" # 设置为true启用远程KV存储，false则使用本地存储

# 构建配置
[build]
command = "npm run build"

[site]
bucket = "./dist"