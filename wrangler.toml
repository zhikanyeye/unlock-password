# 青云盾加密宝 Cloudflare Pages 配置文件

# 重要提示：
# 本项目使用Cloudflare Pages部署，不需要使用Cloudflare Workers

# 构建配置
[build]
command = "npm run build"

[site]
bucket = "./dist"

# 环境变量在Cloudflare Pages的项目设置中配置，不在此文件中设置
# 需要配置的环境变量（在Pages项目中，点击「Settings」>「Environment variables」）：
# - VITE_APP_TITLE: 青云盾加密宝
# - VITE_APP_DESCRIPTION: 安全的文本加密分享工具
# - VITE_ADMIN_PASSWORD: 你的管理员密码（用于管理永久不过期的加密内容）
# 注意：所有客户端可访问的环境变量必须使用VITE_前缀

# 页面函数配置
[functions]
node_compat = true